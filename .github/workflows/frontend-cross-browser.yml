name: Frontend cross-browser and backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner (test-only)
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build frontend
        run: npm run build

      - name: Run cross-browser and mobile tests
        run: npm run test:e2e

  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend unit tests (isolated in-memory SQLite)
        env:
          APP_ENV: testing
          DB_ENGINE: sqlite
          FLASK_DEBUG: '0'
        run: python -m pytest -q
