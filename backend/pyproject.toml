[project]
name = "myalumni-backend"
version = "2.0.0"
description = "MyAlumni 2.0 Backend Flask API Service"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.3",
    "Flask-Cors>=4.0.1",
    "PyJWT>=2.8.0",
    "Werkzeug>=3.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "gunicorn>=21.2.0",
    "psycopg[binary]>=3.2,<4"
]

[tool.vercel]
entrypoint = "run:app"

