name: Frontend cross-browser checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner (test-only)
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build frontend
        run: npm run build

      - name: Run cross-browser and mobile tests
        run: npm run test:e2e
